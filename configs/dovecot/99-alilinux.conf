mail_driver = maildir
mail_path = %{home}/Maildir
ssl = required
ssl_min_protocol = TLSv1.2
ssl_server {
  cert_file = /etc/letsencrypt/live/mail.alilinux.ir/fullchain.pem
  key_file = /etc/letsencrypt/live/mail.alilinux.ir/privkey.pem
}
auth_allow_cleartext = no
auth_mechanisms = plain login
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}
auth_username_format = %{user | username}
